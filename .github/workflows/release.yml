name: Release whatSnap
# Pushing a version tag, such as v0.1.0, builds and publishes a stable release.
# Running this workflow by hand on master does the same for the version in
# Cargo.toml, and makes the tag itself. The update check's stable channel
# offers the newest of these.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum
    # Inno Setup isn't installed here: cargo release downloads a pinned copy
    # (shipfitter's tools::iscc) when it can't find one.
    - name: Install CMake and Ninja
      run: choco install cmake ninja -y --no-progress
    # The tag names the version, so a tag that doesn't match Cargo.toml fails here
    # instead of publishing a release whose app reports another version.
    - name: Check the tag matches Cargo.toml
      id: version
      shell: bash
      run: |
        CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          TAG="v$CARGO_VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG already exists; bump the version in Cargo.toml first"
            exit 1
          fi
        else
          TAG="$GITHUB_REF_NAME"
          if [ "${TAG#v}" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $TAG doesn't match version $CARGO_VERSION in Cargo.toml"
            exit 1
          fi
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT
    - name: Build and sign
      env:
        MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      run: |
        if (-not $env:MINISIGN_KEY) { throw "The MINISIGN_KEY secret is missing, so the release can't be signed" }
        cargo release
        if ($LASTEXITCODE -ne 0) { throw "cargo release failed" }
    - name: Upload release files
      uses: actions/upload-artifact@v7
      with:
        name: whatSnap-release
        path: |
          target/release/whatSnap_setup.exe
          target/release/whatSnap_setup.exe.minisig
          target/release/whatSnap.zip
          target/release/whatSnap.zip.minisig
        if-no-files-found: error
        retention-days: 7

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Download release files
      uses: actions/download-artifact@v8
      with:
        name: whatSnap-release
        path: dist
    # On a hand run the tag doesn't exist yet, so this makes it at the commit
    # that was built. The release goes out with no notes: write the changelog
    # on GitHub afterwards (running again won't overwrite it).
    - name: Create release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.build-windows.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: whatSnap ${{ needs.build-windows.outputs.tag }}
        files: dist/*
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
