name: Release whatSnap
# Pushing a version tag, such as v0.1.0 (or 0.1.0), builds a stable release and attaches
# its files: push one with git, or make it with "Draft a new release" on
# GitHub. (A hand run can't make the tag itself: GitHub refuses the workflow's
# token a new tag on commits that hold workflow files.) The update check's
# stable channel offers the newest of these.
on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum
    # Inno Setup isn't installed here: cargo release downloads a pinned copy
    # (shipfitter's tools::iscc) when it can't find one.
    - name: Install CMake and Ninja
      run: choco install cmake ninja -y --no-progress
    # The tag names the version, so a tag that doesn't match Cargo.toml fails here
    # instead of publishing a release whose app reports another version.
    - name: Check the tag matches Cargo.toml
      id: version
      shell: bash
      run: |
        CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
        TAG="$GITHUB_REF_NAME"
        if [ "${TAG#v}" != "$CARGO_VERSION" ]; then
          echo "::error::Tag $TAG doesn't match version $CARGO_VERSION in Cargo.toml"
          exit 1
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT
    - name: Build and sign
      env:
        MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      run: |
        if (-not $env:MINISIGN_KEY) { throw "The MINISIGN_KEY secret is missing, so the release can't be signed" }
        cargo release
        if ($LASTEXITCODE -ne 0) { throw "cargo release failed" }
    - name: Upload release files
      uses: actions/upload-artifact@v7
      with:
        name: whatSnap-release
        path: |
          target/release/whatSnap_setup.exe
          target/release/whatSnap_setup.exe.minisig
          target/release/whatSnap.zip
          target/release/whatSnap.zip.minisig
        if-no-files-found: error
        retention-days: 7

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Download release files
      uses: actions/download-artifact@v8
      with:
        name: whatSnap-release
        path: dist
    # The release goes out with no notes: write the changelog on GitHub
    # afterwards (a release made there first keeps its notes).
    - name: Create release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.build-windows.outputs.tag }}
        name: whatSnap ${{ needs.build-windows.outputs.tag }}
        files: dist/*
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
