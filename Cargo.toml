[package]
name = "whantv"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"

[dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
wxdragon = "0.9.19"
qrcode = "0.14.1"
# Only used to encode the pairing QR code as a PNG. Default features pull in
# every format the crate supports, including rav1e (a full AV1 encoder), EXR,
# WebP, TIFF and GIF - 63 crates that are compiled and then dead-stripped.
image = { version = "0.25.10", default-features = false, features = ["png"] }
base64 = "0.22.1"
live-region = "0.2.0"
rodio = { version = "0.22.2", features = ["default", "symphonia-vorbis", "symphonia-all"] }
rodio-wsola = "0.2.0"
hound = "3.5.1"
opus = "0.3.1"
ogg = "0.9.2"
chrono = "0.4.45"
phonenumber = "0.3.10"
interprocess = "2.4"
uuid = { version = "1.24.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# windows-core is used directly (not just via windows::core) because the
# #[windows::core::implement] macro expands to code that references the bare
# `windows_core` crate name, which only resolves if it's an explicit
# dependency here, not just re-exported through `windows`.
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_Media_MediaFoundation", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_JobObjects", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_Diagnostics_Debug", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Networking_WinSock", "Win32_System_IO"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1

[build-dependencies]
embed-manifest = "1.5.0"
winres = "0.1.12"
