# share-target is the small helper behind the Windows Share menu; a plain
# `cargo build` still builds only whatSnap (and its backend).
[workspace]
members = [".", "share-target"]
default-members = ["."]

[package]
name = "whatsnap"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"

# The executable is named after the app; the library crate is `whatsnap`.
[[bin]]
name = "whatSnap"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
# All of wxdragon's optional wxWidgets parts are switched off
# (default-features = false): no printing, TIFF/JPEG/GIF/XPM/... image
# handlers, regex, Tango art icons or asserts. whatSnap builds every bitmap from
# raw pixels and uses none of them; add a feature back here if something new
# needs it.
wxdragon = { version = "0.9.22", default-features = false }
qrcode = { version = "0.14.1", default-features = false }
live-region = "0.3.3"
wx-utils = { version = "0.4.2", features = ["shortcuts", "global-hotkeys"] }
key-chord = "0.2.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
rodio-wsola = "0.2.0"
opus = "0.3.1"
nnnoiseless = { version = "0.5.2", default-features = false }
# The message list describes itself to screen readers (see ui/message_list.rs).
accesskit = "0.25.1"

[target.'cfg(windows)'.dependencies]
# windows-core is used directly (not just via windows::core) because the
# #[windows::core::implement] macro expands to code that references the bare
# `windows_core` crate name, which only resolves if it's an explicit
# dependency here, not just re-exported through `windows`.
windows-core = "0.62.2"
accesskit_windows = "0.35.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Storage_Xps", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_Media_MediaFoundation", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_JobObjects", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Recovery", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Variant", "Win32_System_Diagnostics_Debug", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Data_Xml_Dom", "UI_Notifications"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1

[build-dependencies]
embed-manifest = "1.5.0"
winres = "0.1.12"
