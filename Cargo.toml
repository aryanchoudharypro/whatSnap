[package]
name = "whantv"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"

[dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
wxdragon = "0.9.16"
accesskit = "0.24.0"
qrcode = "0.14.1"
image = "0.25.10"
base64 = "0.22.1"
live-region = "0.2.0"
rodio = { version = "0.22.2", features = ["default", "symphonia-vorbis", "symphonia-all"] }
rodio-wsola = "0.2.0"
hound = "3.5.1"
opus = "0.3.1"
ogg = "0.9.2"
chrono = "0.4.45"
phonenumber = "0.3.10"
interprocess = "2.4"
uuid = { version = "1.24.0", features = ["v4"] }
notify-rust = "4.17.0"

[target.'cfg(windows)'.dependencies]
accesskit_windows = "0.33.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_JobObjects", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_Diagnostics_Debug", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Networking_WinSock", "Win32_System_IO"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1

[patch.crates-io]
wxdragon = { git = "https://github.com/AllenDang/wxDragon", rev = "9ff165f" }

[build-dependencies]
embed-manifest = "1.5.0"
winres = "0.1.12"
