[package]
name = "whatsnap-share"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
publish = false

# The Windows Share menu's way into whatSnap. Windows only lists packaged apps
# there, so this small exe is the application of a sparse package (see
# packaging/share/); whatSnap.exe itself stays unpackaged, so its notifications
# and data folders don't change. It only collects what was shared and starts
# whatSnap.exe with it, which hands it on to a running copy.
[[bin]]
name = "whatSnapShare"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
	"ApplicationModel_Activation",
	"ApplicationModel_DataTransfer_ShareTarget",
	"Foundation_Collections",
	"Management_Deployment",
	"Storage_Search",
	"Storage_Streams",
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Security_Cryptography",
	"Win32_System_Com",
	"Win32_System_Diagnostics_Debug",
	"Win32_System_Kernel",
	"Win32_System_Ole",
	"Win32_System_Registry",
	"Win32_System_SystemInformation",
	"Win32_System_Threading",
	"Win32_System_Time",
	"Win32_System_Variant",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }
